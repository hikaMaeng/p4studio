name: p4studio

services:
  studio:
    container_name: studio
    build:
      context: ./apps/studio
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      # Keep SQLite and its WAL/SHM siblings on the persistent data volume.
      P4STUDIO_SQLITE_PATH: /app/data/p4studio.db
    ports:
      - "127.0.0.1:${P4STUDIO_PORT:?P4STUDIO_PORT is required}:${P4STUDIO_PORT:?P4STUDIO_PORT is required}"
    volumes:
      - studio-data:/app/data
      - ./apps/studio/docker/volumes/ssh:/run/studio-ssh:ro
    init: true
    networks:
      - studio-control
    restart: unless-stopped

volumes:
  studio-data:
    name: p4studio_studio-data

networks:
  # P4 control traffic must leave Docker for LAN/VPN agents. Docker's automatic
  # pool previously chose 192.168.0.0/20, shadowing the physical agent LAN.
  studio-control:
    driver: bridge
    ipam:
      config:
        - subnet: "${P4STUDIO_DOCKER_SUBNET:-10.253.240.0/24}"
